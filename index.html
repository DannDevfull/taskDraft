<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
        <link rel="stylesheet" href="/css/style.css">
        <title>Taskord</title>
    </head>
    <body class='dark-theme'>
        <header>
            <div class="title">
                <a href="#">
                    <h1>Task<span class="letraAnimada"></span>rd</h1>
                </a>

                <button class="change-theme">
                     <i class="fa-solid fa-moon"></i>
                </button>
            </div>
          
            
            <fieldset class="menu">
                <div class="double-edge">
                    <label for="text" class="rotulo">Descreva a sua tarefa no campo abaixo</label>
                    <input
                        required
                        type="text"
                        placeholder="O que precisar ser feito hoje?"
                        id="text"
                        minlength="4"
                        maxlength="100"
                        size="30px"
                     >
                </div>
                 <button class="btn">
                    <i class="fa-solid fa-plus"></i>
                    Tarefas
                 </button>
            </fieldset>

            <div class="taskPlus">
                <p>Tarefas Adicionadas</p>
            </div>
        </header>
        
        <main>
            <section class="hero">
               <article class="tasks">
               </article>
            </section>
        </main>

        <footer>
            <h1>Task<span class="letraAnimada"></span>rd</h1>
            <p>&copy;Todos os direitos reservados</p>
        </footer>

        <script src="src/script.js"></script>
    </body>
</html>
